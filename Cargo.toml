[package]
name = "pida-tray"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Lightweight Windows system tray controller for a PiDA server"
license = "MIT"
repository = "https://github.com/LeHuman/PiDA-Tray"
readme = "README.md"
keywords = ["system-tray", "home-automation", "windows", "rest-api", "egui"]
categories = ["gui", "hardware-support"]
exclude = [
    ".agent/",
    ".github/",
    ".vscode/",
    "AGENTS.md",
    "TODO.md",
]

# The flyout is Windows-only; the default Linux docs build has no eframe backend.
[package.metadata.docs.rs]
default-target = "x86_64-pc-windows-msvc"
targets = []

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow"] }
tray-icon = "0.26"
single-instance = "0.3"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "macros"] }
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json"] }
serde = { version = "1", features = ["derive"] }
# `preserve_order` is REQUIRED: the schema's declaration order is meaningful.
serde_json = { version = "1", features = ["preserve_order"] }
dirs = "7"
# PNG-only decoding for /api/icon/<path>
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
