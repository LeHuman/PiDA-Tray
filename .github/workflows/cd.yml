name: CD

on:
  push:
    tags:
      - "v*"
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            ver="${GITHUB_REF_NAME#v}"
          else
            ver="0.0.0+sha.${GITHUB_SHA::7}"
          fi
          sed -i "0,/^version = .*/s//version = \"$ver\"/" Cargo.toml
          echo "version=$ver" >> "$GITHUB_OUTPUT"
      - run: cargo build --release
      - name: Stage release files
        shell: bash
        run: |
          mkdir -p target/release-dist
          cp target/release/pida-tray.exe target/release-dist/pida-tray-windows-x86_64.exe
          cd target/release-dist
          sha256sum pida-tray-windows-x86_64.exe > pida-tray-windows-x86_64.exe.sha256
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            target/release-dist/pida-tray-windows-x86_64.exe
            target/release-dist/pida-tray-windows-x86_64.exe.sha256
      - name: Upload artifact (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v7
        with:
          name: pida-tray-${{ steps.ver.outputs.version }}
          path: target/release-dist/*
