name: CD

on:
  push:
    tags:
      - "v*"
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            ver="${GITHUB_REF_NAME#v}"
          else
            ver="0.0.0+sha.${GITHUB_SHA::7}"
          fi
          sed -i "0,/^version = .*/s//version = \"$ver\"/" Cargo.toml
          echo "version=$ver" >> "$GITHUB_OUTPUT"
      - run: cargo build --release
      - name: Stage release files
        shell: bash
        run: |
          mkdir -p target/release-dist
          cp target/release/pida-tray.exe target/release-dist/pida-tray-windows-x86_64.exe
          cd target/release-dist
          sha256sum pida-tray-windows-x86_64.exe > pida-tray-windows-x86_64.exe.sha256
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            target/release-dist/pida-tray-windows-x86_64.exe
            target/release-dist/pida-tray-windows-x86_64.exe.sha256
      - name: Upload artifact (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v7
        with:
          name: pida-tray-${{ steps.ver.outputs.version }}
          path: target/release-dist/*
      - name: Publish to crates.io
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          # The version stamp above rewrites Cargo.toml (and can touch the
          # lock), so the tree is dirty. Restore the committed manifest and
          # require it to match the tag before publishing.
          git checkout -- Cargo.toml Cargo.lock
          manifest_version=$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f 2)
          if [ "$manifest_version" != "${{ steps.ver.outputs.version }}" ]; then
            echo "Cargo.toml is $manifest_version but the tag is ${{ steps.ver.outputs.version }}; bump the manifest before tagging." >&2
            exit 1
          fi
          if [ -n "${CARGO_REGISTRY_TOKEN:-}" ]; then
            cargo publish -p pida-tray
          else
            echo "CARGO_REGISTRY_TOKEN not set; skipping crates.io publish."
          fi
