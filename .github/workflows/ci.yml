name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-features

  fmt:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings

  doc:
    runs-on: windows-latest
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps --document-private-items

  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Stamp version
        shell: bash
        run: |
          ver="0.0.0+sha.${GITHUB_SHA::7}"
          sed -i "0,/^version = .*/s//version = \"$ver\"/" Cargo.toml
          echo "Building $ver"
      - run: cargo build --release
      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p target/release-dist
          cp target/release/pida-tray.exe target/release-dist/pida-tray-windows-x86_64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: pida-tray-windows-x86_64
          path: target/release-dist/pida-tray-windows-x86_64.exe
          if-no-files-found: error
